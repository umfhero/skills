<!--
  Pixel Design sprites, plain HTML.
  Paste inline where the icon is needed, or register them once in a hidden
  <svg><symbol> block and reference with <use href="#pd-arrow">.
  Every sprite uses fill="currentColor" so it inherits the surrounding colour,
  except the mascot which is deliberately multi tone.
-->

<!-- Arrow, points right. Rotate with CSS for other directions. -->
<svg class="pd-icon pd-arrow" viewBox="0 0 8 8" width="11" height="11"
     fill="currentColor" aria-hidden="true" focusable="false" shape-rendering="crispEdges">
  <rect x="1" y="3" width="5" height="2" />
  <rect x="4" y="1" width="1" height="1" />
  <rect x="5" y="2" width="1" height="1" />
  <rect x="6" y="3" width="1" height="2" />
  <rect x="5" y="5" width="1" height="1" />
  <rect x="4" y="6" width="1" height="1" />
</svg>

<!-- Spark, the decorative twinkle -->
<svg class="pd-icon pd-spark" viewBox="0 0 7 7" width="12" height="12"
     fill="currentColor" aria-hidden="true" focusable="false" shape-rendering="crispEdges">
  <rect x="3" y="0" width="1" height="7" />
  <rect x="0" y="3" width="7" height="1" />
  <rect x="1" y="1" width="1" height="1" />
  <rect x="5" y="1" width="1" height="1" />
  <rect x="1" y="5" width="1" height="1" />
  <rect x="5" y="5" width="1" height="1" />
</svg>

<!-- Check, for completed states -->
<svg class="pd-icon pd-check" viewBox="0 0 8 8" width="12" height="12"
     fill="currentColor" aria-hidden="true" focusable="false" shape-rendering="crispEdges">
  <rect x="0" y="4" width="1" height="1" />
  <rect x="1" y="5" width="1" height="1" />
  <rect x="2" y="6" width="1" height="1" />
  <rect x="3" y="5" width="1" height="1" />
  <rect x="4" y="4" width="1" height="1" />
  <rect x="5" y="3" width="1" height="1" />
  <rect x="6" y="2" width="1" height="1" />
  <rect x="7" y="1" width="1" height="1" />
</svg>

<!-- Mascot, multi tone, perches on a panel corner -->
<svg class="pd-icon pd-mascot" viewBox="0 0 8 9" width="44" height="50"
     aria-hidden="true" focusable="false" shape-rendering="crispEdges">
  <rect x="2" y="0" width="4" height="1" fill="#0b1130" />
  <rect x="1" y="1" width="6" height="4" fill="#6258e9" />
  <rect x="2" y="2" width="1" height="1" fill="#ffffff" />
  <rect x="5" y="2" width="1" height="1" fill="#ffffff" />
  <rect x="3" y="4" width="2" height="1" fill="#0b1130" />
  <rect x="1" y="5" width="6" height="1" fill="#0b1130" />
  <rect x="2" y="6" width="4" height="2" fill="#3561dc" />
  <rect x="1" y="8" width="2" height="1" fill="#0b1130" />
  <rect x="5" y="8" width="2" height="1" fill="#0b1130" />
</svg>
